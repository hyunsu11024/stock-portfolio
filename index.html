<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --bg: #F8FAFC; --fg: #0f172a;

  --label-w: 110px; --label-w-sm: 140px;
  --group-w: 72px; --group-w-sm: 86px;
  --font-cell: 17px; --font-cell-sm: 19px;
}

body { font-family:'Pretendard',sans-serif; background:var(--bg); color:var(--fg); }

/* 스크롤바 */
.sb::-webkit-scrollbar { width:12px; height:12px; }
.sb::-webkit-scrollbar-track { background:#f1f5f9; border-radius:8px; }
.sb::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:8px; }
.sb::-webkit-scrollbar-thumb:hover { background:var(--muted); }
.sb-dark::-webkit-scrollbar { height:6px; }
.sb-dark::-webkit-scrollbar-track { background:var(--nav-bg); border-radius:8px; }
.sb-dark::-webkit-scrollbar-thumb { background:#475569; border-radius:8px; }

/* 모달 */
.overlay { background:rgba(15,23,42,.6); backdrop-filter:blur(8px); }

/* 편집 셀 */
.ce {
  outline:none; cursor:text; border-radius:6px; padding:2px 6px;
  border:1px solid transparent; word-break:break-all; overflow-wrap:anywhere;
  white-space:pre-wrap; transition: border-color .15s, background .15s;
}
.ce:hover { background:#f1f5f9; border-color:var(--card-border); }
.ce:focus { background:#fff; box-shadow:0 0 0 2px rgba(99,102,241,.35); border-color:var(--primary); }
[contenteditable="true"]:empty:before { content:attr(data-placeholder); color:var(--muted); pointer-events:none; display:block; }

/* 줄바꿈 */
.tw { white-space:pre-wrap !important; word-break:break-all !important; overflow-wrap:anywhere !important; line-height:1.5; }

/* 토스트 */
#toast {
  visibility:hidden; min-width:260px; background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff; text-align:center; border-radius:12px; padding:12px 20px; position:fixed; z-index:9999;
  left:50%; bottom:40px; transform:translateX(-50%);
  box-shadow:0 10px 25px rgba(79,70,229,.4); font-weight:700;
  opacity:0; transition: opacity .3s, bottom .3s, visibility .3s;
}
#toast.show { visibility:visible; opacity:1; bottom:60px; }

/* 통계 바 */
.stat-pill { background:#f1f5f9; border:1px solid var(--card-border); border-radius:10px; padding:3px 12px; font-size:13px; font-weight:700; white-space:nowrap; }
.stat-val { color:var(--primary-dark); margin-left:4px; }

/* 검색 */
.search-box { background:var(--nav-bg); border:1px solid var(--nav-border); border-radius:10px; padding:6px 12px; color:#fff; font-size:13px; outline:none; width:180px; }
.search-box::placeholder { color:#64748b; }
.search-box:focus { border-color:var(--primary-light); box-shadow:0 0 0 2px rgba(99,102,241,.2); }

/* 드래그 하이라이트 */
.drag-over { outline:2px solid var(--primary); outline-offset:-2px; background:rgba(99,102,241,.05) !important; }

/* 스티키 가로 스크롤바 */
.sticky-scroll-wrap { position:relative; }
.sticky-scrollbar {
  position:sticky; bottom:0; z-index:50;
  overflow-x:auto; overflow-y:hidden;
  background:linear-gradient(to top, rgba(241,245,249,.95), rgba(241,245,249,.5));
  border-top:1px solid #e2e8f0;
  border-radius:0 0 16px 16px;
}
.sticky-scrollbar::-webkit-scrollbar { height:14px; }
.sticky-scrollbar::-webkit-scrollbar-track { background:#f1f5f9; border-radius:8px; }
.sticky-scrollbar::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:8px; border:3px solid #f1f5f9; }
.sticky-scrollbar::-webkit-scrollbar-thumb:hover { background:#64748b; }
.sticky-scrollbar-inner { height:1px; }
</style>
</head>

/* Finnhub API 호출 헬퍼 */
function fhGet(endpoint){
  return fetch('https://finnhub.io/api/v1/'+endpoint+'&token='+FHKEY).then(function(r){
    if(!r.ok)throw'HTTP '+r.status;return r.json();
  });
}

/* 미국주식: Finnhub으로 현재가 + 기업정보 + 배당 + 52주 데이터 */
function fetchUS(p){
  var tk=p.ticker.toUpperCase();
  return Promise.all([
    fhGet('quote?symbol='+tk),
    fhGet('stock/profile2?symbol='+tk),
    fhGet('stock/metric?symbol='+tk+'&metric=all').catch(function(){return{}})
  ]).then(function(res){
    var quote=res[0],prof=res[1],metric=res[2];
    // 현재가
    if(quote&&quote.c&&quote.c>0){
      p.currentPrice=quote.c;
      if(quote.l)p.buyPrice=p.buyPrice||quote.l;
    }
    // 기업 프로필
    if(prof&&prof.name){
      p.name=p.name||prof.name;
      if(prof.ipo)p.listedDate=p.listedDate||prof.ipo;
      if(prof.marketCapitalization)p.marketCap=prof.marketCapitalization*1e6;
      p.country=p.country||'미국';
    }
    // 재무 지표 (배당, 52주 데이터)
    if(metric&&metric.metric){
      var m=metric.metric;
      if(m.dividendYieldIndicatedAnnual!=null&&!p.divYield)
        p.divYield=(m.dividendYieldIndicatedAnnual).toFixed(2)+'%';
      if(m.dividendPerShareAnnual!=null&&!p.recentDiv)
        p.recentDiv=m.dividendPerShareAnnual;
      if(m['52WeekLow']!=null&&!p.buyPrice)
        p.buyPrice=m['52WeekLow'];
      if(m.marketCapitalization!=null&&!p.marketCap)
        p.marketCap=m.marketCapitalization*1e6;
      if(m.payoutRatioAnnual!=null){
        // 배당주기 추정: Finnhub은 직접 제공 안 하므로 분기 기본값
        if(!p.divFreq)p.divFreq='분기';
      }
    }
    p.updatedAt=Date.now();
    return p;
  });
}

/* 한국주식: 다중 CORS 프록시 + 폴백 */
var PROXIES=[
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?',
  'https://api.codetabs.com/v1/proxy?quest='
];

function tryProxies(targetUrl,idx){
  idx=idx||0;
  if(idx>=PROXIES.length)return Promise.reject('all proxies failed');
  var url=PROXIES[idx]+encodeURIComponent(targetUrl);
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw'HTTP '+r.status;
    return r.text();
  }).then(function(txt){
    // allorigins는 JSON으로 감쌀 수 있음
    try{var j=JSON.parse(txt);return j}catch(e){throw'not json'}
  }).catch(function(){
    return tryProxies(targetUrl,idx+1);
  });
}

function fetchKR(p){
  var tk=p.ticker.replace(/^0+/,'').padStart(6,'0');
  var basicUrl='https://m.stock.naver.com/api/stock/'+tk+'/basic';
  var integUrl='https://m.stock.naver.com/api/stock/'+tk+'/integration';
  var divUrl='https://m.stock.naver.com/api/stock/'+tk+'/dividend';

  // 기본정보 + 통합정보 + 배당정보 병렬 조회
  return Promise.all([
    tryProxies(basicUrl).catch(function(){return null}),
    tryProxies(integUrl).catch(function(){return null}),
    tryProxies(divUrl).catch(function(){return null})
  ]).then(function(res){
    var basic=res[0], integ=res[1], divData=res[2];

    // 기본정보: 종목명, 현재가, 시가총액
    if(basic){
      if(basic.stockName)p.name=p.name||basic.stockName;
      if(basic.closePrice){var v=parseInt(String(basic.closePrice).replace(/,/g,''));if(!isNaN(v))p.currentPrice=v}
      if(basic.marketValue){var mc=parseInt(String(basic.marketValue).replace(/,/g,''));if(!isNaN(mc))p.marketCap=mc}
      if(basic.listingDate)p.listedDate=p.listedDate||basic.listingDate;
      if(basic.stockExchangeType&&basic.stockExchangeType.name)p.country=p.country||'한국';
    }

    // 통합정보: 52주 최저가, 시총 보완
    if(integ){
      if(integ.low52wPrice&&!p.buyPrice){var lv=parseInt(String(integ.low52wPrice).replace(/,/g,''));if(!isNaN(lv))p.buyPrice=lv}
      if(!p.marketCap&&integ.marketValue){var mc2=parseInt(String(integ.marketValue).replace(/,/g,''));if(!isNaN(mc2))p.marketCap=mc2}
      if(integ.listingDate)p.listedDate=p.listedDate||integ.listingDate;
      // dealTrendInfos에서 현재가 보완
      if(!p.currentPrice&&integ.dealTrendInfos&&integ.dealTrendInfos.length){
        var latest=integ.dealTrendInfos[0];
        if(latest.closePrice){var cv=parseInt(String(latest.closePrice).replace(/,/g,''));if(!isNaN(cv))p.currentPrice=cv}
      }
    }

    // 배당정보
    if(divData){
      // 배당률
      if(divData.dividendYield!=null&&!p.divYield){
        var dy=parseFloat(String(divData.dividendYield));
        if(!isNaN(dy))p.divYield=dy.toFixed(2)+'%';
      }
      // 최근 배당금
      if(divData.dividend!=null&&!p.recentDiv){
        var dv=parseInt(String(divData.dividend).replace(/,/g,''));
        if(!isNaN(dv))p.recentDiv=dv;
      }
      // 배당 히스토리에서 정보 추출
      if(divData.dividendInfos&&divData.dividendInfos.length&&!p.divFreq){
        var cnt=divData.dividendInfos.length;
        if(cnt>=4)p.divFreq='분기';
        else if(cnt>=2)p.divFreq='반기';
        else p.divFreq='연간';
        // 최근 배당금 보완
        if(!p.recentDiv&&divData.dividendInfos[0].dividend){
          var rd=parseInt(String(divData.dividendInfos[0].dividend).replace(/,/g,''));
          if(!isNaN(rd))p.recentDiv=rd;
        }
      }
    }

    p.country=p.country||'한국';p.updatedAt=Date.now();
    return p;
  }).catch(function(){
    return fetchKR_google(p);
  });
}

/* 단일 종목 API 조회 (티커 입력 시 호출) */
function fetchTicker(p){
  if(!p.ticker)return Promise.resolve(p);
  var tk=p.ticker.toUpperCase();
  toast("'"+tk+"' 조회 중...");

  var isKr=/^\d{4,6}$/.test(tk);
  var promise;

  if(isKr){
    p.country=p.country||'한국';
    promise=fetchKR(p);
  }else{
    p.country=p.country||'미국';
    promise=fetchUS(p);
  }

  return promise.then(function(updated){
    save(true);render();
    if(updated.currentPrice){
      toast("'"+tk+"' "+(updated.name||'')+" → "+fC(updated.currentPrice,isKr)+" 반영됨");
    }else{
      toast("'"+tk+"' → API에서 데이터를 찾지 못했습니다");
    }
    return updated;
  }).catch(function(err){
    toast("'"+tk+"' 조회 실패: 시트 동기화로 재시도합니다");
    doSync(true,[tk]);
    return p;
  });
}

/* 전체 종목 가격 일괄 갱신 */
function updateAllPrices(){
  if(!FHKEY){toast("API 키를 먼저 설정하세요");openApiModal();return}
  toast("전체 가격 갱신 중...");
  fetchExRate();

  var queue=PL.filter(function(p){return p.ticker});
  var idx=0,ok=0,fail=0;

  function next(){
    if(idx>=queue.length){
      render();save(true);
      toast("갱신 완료: "+ok+"개 성공"+(fail?" / "+fail+"개 실패":""));
      var now=new Date();lastSync=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
      var se=$('st');if(se)se.innerText=lastSync;
      return;
    }
    var p=queue[idx++];
    var kr=/^\d{4,6}$/.test(p.ticker);
    var fn=kr?(fetchKR(p).catch(function(){return fetchKRETF(p)})):fetchUS(p);

    fn.then(function(u){if(u.currentPrice)ok++;else fail++})
      .catch(function(){fail++})
      .finally(function(){setTimeout(next,kr?200:1100)});
  }
  next();
}

function parseCSV(t){var rows=[],row=[],q=false,c='';for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch==='"'){if(i+1<t.length&&t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else{if(ch==='"')q=true;else if(ch===','){row.push(c.trim());c=''}else if(ch==='\n'){row.push(c.trim());rows.push(row);row=[];c=''}else if(ch!=='\r')c+=ch}}if(c||row.length){row.push(c.trim());rows.push(row)}return rows.map(function(r){return r.map(function(x){return(x==='"'||x==='""')?'':x})})}

function doSync(show,forceTickers){
  if(show)toast("시트 동기화 중...");
  var m=SU.match(/\/d\/([a-zA-Z0-9_-]+)/),sid=m?m[1]:"196J_0woZs8xsEzEnyPmxoe9VjT25tgMEOSeYWCM5-yM",gid="0";
  try{var u=new URL(SU),gp=u.searchParams.get('gid');if(gp)gid=gp;else{var hm=u.hash.match(/gid=(\d+)/);if(hm)gid=hm[1]}}catch(e){}
  var csv='https://docs.google.com/spreadsheets/d/'+sid+'/gviz/tq?tqx=out:csv&gid='+gid+'&t='+Date.now();
  var forceSet=new Set((forceTickers||[]).map(function(t){return t.toUpperCase()}));

  fetch(csv,{cache:'no-store'}).then(function(r){if(!r.ok)throw'e';return r.text()}).then(function(txt){
    var tr=txt.trim();if(!tr||tr[0]==='<'||tr[0]==='{')throw'inv';
    var rows=parseCSV(tr);if(!rows.length)throw'empty';
    var hd=rows[0].map(function(h){return h?String(h).replace(/\s/g,'').toUpperCase():''}),cP=-1,cT=-1;
    hd.forEach(function(h,i){if(h.indexOf('현재가')>=0||h.indexOf('PRICE')>=0)cP=i;if(h.indexOf('티커')>=0||h.indexOf('TICKER')>=0||h.indexOf('종목코드')>=0)cT=i});

    var dm=new Map();
    rows.forEach(function(r){var ak=function(k){if(k){dm.set(k,r);if(!isNaN(k)&&k.length<=6){dm.set(Number(k)+'',r);dm.set(k.padStart(6,'0'),r)}}};if(cT!==-1&&r[cT]!=null)ak(String(r[cT]).toUpperCase().trim());else r.forEach(function(c){if(c!=null){var k=String(c).toUpperCase().trim();if(k&&!dm.has(k))ak(k)}})});

    var sf=['name','country','listedDate','marketCap','buyPrice','currentPrice','divYield','recentDiv','divFreq','reviewPos','reviewNeg','reviewOverall','reviewRank','capGains','cashDiv','simETF','oppETF'];
    var cnt=0,st=parseInt(localStorage.getItem('v80_ls'))||0;
    var missed=[];

    PL.forEach(function(p){
      if(!p.ticker)return;
      var tk=String(p.ticker).toUpperCase().trim();
      var rd=dm.get(tk);
      if(!rd){missed.push(p);return}
      // 강제 대상이거나 마지막 동기화 이후 수정 안 된 종목만
      var isForced=forceSet.has(tk);
      if(!isForced&&p.updatedAt&&p.updatedAt>st)return;
      RG.forEach(function(g){g.items.forEach(function(it){
        if(sf.indexOf(it.id)<0)return;
        var cl=it.label.replace(/\s/g,'').toUpperCase(),hi=hd.indexOf(cl);

/* Google Finance 개별 조회 (공개 스프레드시트 API 활용) */
function fetchGF(p){
  if(!p.ticker)return;
  var tk=p.ticker.toUpperCase(),isKr=/^\d{4,6}$/.test(tk);
  var symbol=isKr?'KRX:'+tk.padStart(6,'0'):tk;
  // 임시 구글 시트 수식으로 가격 조회
  var qUrl='https://docs.google.com/spreadsheets/d/196J_0woZs8xsEzEnyPmxoe9VjT25tgMEOSeYWCM5-yM/gviz/tq?tqx=out:csv&gid=0&tq='+encodeURIComponent("select * where A='"+tk+"' or A='"+symbol+"' limit 1")+'&t='+Date.now();

  fetch(qUrl,{cache:'no-store'}).then(function(r){return r.text()}).then(function(txt){
    var rows=parseCSV(txt.trim());
    if(rows.length>1){
      // 시트에서 찾음 — 이미 doSync에서 처리됐을 수 있지만 재시도
      return;
    }
    // 시트에 없으면 → Google Visualization API로 GOOGLEFINANCE 결과 가져오기 시도
    // 이 방식은 시트 소유자의 시트에 해당 종목이 추가되어야 동작
    // 대신 종목명으로 기본 정보라도 세팅
    if(isKr){
      p.country=p.country||'한국';
      if(!p.name)p.name=tk;
    }else{
      p.country=p.country||'미국';
      if(!p.name)p.name=tk;
    }
    save(true);render();
    toast("'"+tk+"' → 시트에 종목을 추가하면 자동 연동됩니다");
  }).catch(function(){});
}

function renderStats(){
  var bar=$('stats-bar');if(!bar)return;
  var total=PL.length, owned=0, totalVal=0, totalInvest=0;
  PL.forEach(function(p){
    if(p.ownedQty!=null&&p.ownedQty>0){
      owned++;
      if(p.currentPrice)totalVal+=(p.ownedQty*p.currentPrice*(isKR(p)?1:ER));
      if(p.avgBuyPrice)totalInvest+=(p.ownedQty*p.avgBuyPrice*(isKR(p)?1:ER));
    }
  });
  var totalReturn=totalInvest>0?((totalVal-totalInvest)/totalInvest*100):0;
  var retClass=totalReturn>0?'text-rose-500':totalReturn<0?'text-blue-500':'text-slate-500';
  var retStr=totalReturn>0?'+'+totalReturn.toFixed(1)+'%':totalReturn.toFixed(1)+'%';

  bar.innerHTML=
    '<span class="stat-pill">📊 전체 <span class="stat-val">'+total+'종목</span></span>'+
    '<span class="stat-pill">💼 보유 <span class="stat-val">'+owned+'종목</span></span>'+
    (totalVal?'<span class="stat-pill">💰 평가총액 <span class="stat-val">'+Number(Math.round(totalVal)).toLocaleString('ko-KR')+'원</span></span>':'')+
    (totalInvest?'<span class="stat-pill">📈 총수익률 <span class="stat-val '+retClass+'">'+retStr+'</span></span>':'');
}

  labels.forEach(function(l,i){
    var pct=(values[i]/total*100).toFixed(1);
    legend.innerHTML+='<div class="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-2 border border-slate-100">'+
      '<div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full shrink-0" style="background:'+CHART_COLORS[i%CHART_COLORS.length]+'"></div><span class="font-bold text-slate-700 text-sm">'+l+'</span></div>'+
      '<div class="flex items-center gap-3"><span class="font-bold text-slate-800 text-sm">'+Number(Math.round(values[i])).toLocaleString('ko-KR')+'원</span><span class="text-xs font-bold px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded-full">'+pct+'%</span></div></div>';
  });

  chartInstances.c1=new Chart($('cv-cat'),{type:'doughnut',data:{labels:labels,datasets:[{data:values,backgroundColor:CHART_COLORS.slice(0,labels.length),borderWidth:2,borderColor:'#fff',hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.label+': '+Number(Math.round(ctx.raw)).toLocaleString('ko-KR')+'원 ('+(ctx.raw/total*100).toFixed(1)+'%)'}}}}}});
}

function renderHoldingsChart(body){
  var items=[];
  PL.forEach(function(p){
    if(!p.ownedQty||!p.currentPrice||p.ownedQty<=0)return;
    items.push({name:p.name||p.ticker||'?',val:p.ownedQty*p.currentPrice*(isKR(p)?1:ER)});
  });
  items.sort(function(a,b){return b.val-a.val});
  if(!items.length){body.innerHTML='<div class="flex items-center justify-center h-full text-slate-400 font-bold text-lg">보유 종목이 없습니다.</div>';return}

  var labels=items.map(function(x){return x.name}),values=items.map(function(x){return Math.round(x.val)});
  body.innerHTML='<div style="height:'+Math.max(400,items.length*38)+'px"><canvas id="cv-hold"></canvas></div>';

  chartInstances.c1=new Chart($('cv-hold'),{type:'bar',data:{labels:labels,datasets:[{label:'평가금액(원)',data:values,backgroundColor:CHART_COLORS.slice(0,labels.length).map(function(c){return c+'cc'}),borderColor:CHART_COLORS.slice(0,labels.length),borderWidth:1.5,borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return Number(ctx.raw).toLocaleString('ko-KR')+'원'}}}},scales:{x:{ticks:{callback:function(v){return(v/10000).toLocaleString()+'만'}},grid:{color:'#f1f5f9'}},y:{ticks:{font:{weight:'bold',size:13}},grid:{display:false}}}}});
}

function renderReturnChart(body){
  var items=[];
  PL.forEach(function(p){
    if(!p.avgBuyPrice||!p.currentPrice||p.avgBuyPrice<=0)return;
    var rt=((p.currentPrice-p.avgBuyPrice)/p.avgBuyPrice)*100;
    items.push({name:p.name||p.ticker||'?',rate:rt});
  });
  items.sort(function(a,b){return b.rate-a.rate});
  if(!items.length){body.innerHTML='<div class="flex items-center justify-center h-full text-slate-400 font-bold text-lg">수익률 데이터가 없습니다. 매수평단가를 입력하세요.</div>';return}

  var labels=items.map(function(x){return x.name}),values=items.map(function(x){return+x.rate.toFixed(2)});
  var colors=values.map(function(v){return v>=0?'rgba(244,63,94,0.7)':'rgba(59,130,246,0.7)'});
  var borders=values.map(function(v){return v>=0?'#f43f5e':'#3b82f6'});

  body.innerHTML='<div style="height:'+Math.max(400,items.length*38)+'px"><canvas id="cv-ret"></canvas></div>';
  chartInstances.c1=new Chart($('cv-ret'),{type:'bar',data:{labels:labels,datasets:[{label:'수익률(%)',data:values,backgroundColor:colors,borderColor:borders,borderWidth:1.5,borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return(ctx.raw>0?'+':'')+ctx.raw+'%'}}}},scales:{x:{ticks:{callback:function(v){return v+'%'}},grid:{color:'#f1f5f9'}},y:{ticks:{font:{weight:'bold',size:13}},grid:{display:false}}}}});
}

function renderDividendChart(body){
  var items=[];
  PL.forEach(function(p){
    if(!p.divYield)return;
    var yld=parseFloat(String(p.divYield).replace(/[^0-9.\-]+/g,''));
    if(isNaN(yld)||yld<=0)return;
    items.push({name:p.name||p.ticker||'?',yield:yld,freq:p.divFreq||'-'});
  });
  items.sort(function(a,b){return b.yield-a.yield});
  if(!items.length){body.innerHTML='<div class="flex items-center justify-center h-full text-slate-400 font-bold text-lg">배당 데이터가 없습니다.</div>';return}

  var labels=items.map(function(x){return x.name}),values=items.map(function(x){return+x.yield.toFixed(2)});
  body.innerHTML='<div class="flex flex-col lg:flex-row gap-6"><div class="w-full lg:w-3/5" style="height:'+Math.max(350,items.length*34)+'px"><canvas id="cv-div"></canvas></div>'+
    '<div class="w-full lg:w-2/5"><h4 class="font-extrabold text-slate-700 mb-3">배당 상세</h4><div class="space-y-1.5 max-h-[60vh] overflow-y-auto sb" id="div-detail"></div></div></div>';

  var detail=$('div-detail');
  items.forEach(function(x,i){
    detail.innerHTML+='<div class="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-2 border border-slate-100 text-sm">'+
      '<div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full shrink-0" style="background:'+CHART_COLORS[i%CHART_COLORS.length]+'"></div><span class="font-bold text-slate-700">'+x.name+'</span></div>'+
      '<div class="flex items-center gap-2"><span class="font-extrabold text-emerald-600">'+x.yield.toFixed(2)+'%</span><span class="text-xs text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">'+x.freq+'</span></div></div>';
  });

  chartInstances.c1=new Chart($('cv-div'),{type:'bar',data:{labels:labels,datasets:[{label:'연간 배당률(%)',data:values,backgroundColor:CHART_COLORS.slice(0,labels.length).map(function(c){return c+'aa'}),borderColor:CHART_COLORS.slice(0,labels.length),borderWidth:1.5,borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.raw+'%'}}}},scales:{x:{ticks:{callback:function(v){return v+'%'}},grid:{color:'#f1f5f9'}},y:{ticks:{font:{weight:'bold',size:12}},grid:{display:false}}}}});
}

/* =================================================================
   SECTION 24 — 종목 비교 뷰
   ================================================================= */
function openCompareModal(){
  var e=$('compM');if(e)e.remove();
  var hasSel=PL.filter(function(p){return SP.has(p.id)});
  if(hasSel.length<2){
    // 종목 선택 화면
    $('modals').insertAdjacentHTML('beforeend',
      '<div id="compM" class="fixed inset-0 z-[180] overlay flex items-center justify-center p-4">'+
      '<div class="bg-white rounded-2xl shadow-2xl w-full max-w-[650px] max-h-[85vh] flex flex-col overflow-hidden border border-slate-100">'+
      '<div class="bg-slate-900 px-5 py-4 flex justify-between items-center text-white shrink-0"><h3 class="font-extrabold text-lg">⚖️ 종목 비교</h3><button onclick="$(\'compM\').remove()" class="text-slate-400 hover:text-white text-2xl">✕</button></div>'+
      '<div class="p-4 border-b border-slate-200 bg-slate-50 shrink-0"><p class="text-sm text-slate-600 font-bold">비교할 종목을 2~6개 선택하세요</p>'+
      '<input id="comp-search" type="text" class="mt-2 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold outline-none" placeholder="🔍 종목명/티커 검색..." oninput="filterCompList(this.value)"></div>'+
      '<div id="comp-list" class="flex-1 overflow-y-auto sb p-3 space-y-1"></div>'+
      '<div class="bg-white px-5 py-3 flex justify-between items-center border-t border-slate-200 shrink-0">'+
      '<span id="comp-count" class="text-sm font-bold text-slate-500">0개 선택</span>'+
      '<div class="flex gap-2"><button onclick="$(\'compM\').remove()" class="px-4 py-2 bg-slate-100 rounded-xl font-bold">취소</button>'+
      '<button onclick="startCompare()" id="comp-go" class="px-5 py-2 bg-indigo-600 text-white rounded-xl font-bold opacity-50 pointer-events-none">비교하기</button></div></div></div></div>');
    compSelected=new Set();
    renderCompList('');
    return;
  }
  // 이미 선택된 종목이 있으면 바로 비교
  compSelected=new Set(hasSel.map(function(p){return p.id}));
  showCompareResult();
}

var compSelected=new Set();

function filterCompList(q){renderCompList(q.trim().toUpperCase())}

function renderCompList(q){
  var el=$('comp-list');if(!el)return;
  var filtered=PL.filter(function(p){
    if(!q)return true;
    return(p.name||'').toUpperCase().indexOf(q)>=0||(p.ticker||'').toUpperCase().indexOf(q)>=0;
  });
  el.innerHTML=filtered.map(function(p){
    var cat=cats.find(function(c){return c.id===p.cat});
    var checked=compSelected.has(p.id);
    return'<label class="flex items-center gap-3 px-3 py-2.5 rounded-xl border cursor-pointer transition-all hover:bg-slate-50 '+(checked?'bg-indigo-50 border-indigo-200':'border-slate-200')+'">'+
      '<input type="checkbox" class="w-4 h-4 rounded accent-indigo-600" '+(checked?'checked':'')+' onchange="toggleCompSel('+p.id+',this.checked)">'+
      '<div class="flex-1 min-w-0"><div class="flex items-center gap-2"><span class="font-extrabold text-slate-800 text-sm truncate">'+(p.name||p.ticker||'무제')+'</span>'+
      (p.ticker?'<span class="text-xs font-bold text-indigo-500 bg-indigo-50 px-1.5 py-0.5 rounded">'+p.ticker+'</span>':'')+
      '</div><span class="text-xs text-slate-400">'+(cat?cat.icon+' '+cat.label:'')+'</span></div>'+
      (p.currentPrice?'<span class="text-sm font-bold text-slate-600 shrink-0">'+fC(p.currentPrice,isKR(p))+'</span>':'')+
      '</label>';
  }).join('');
  updateCompCount();
}

function toggleCompSel(id,checked){
  if(checked){if(compSelected.size>=6){toast('최대 6개까지 선택 가능');return}compSelected.add(id)}
  else compSelected.delete(id);
  var q=$('comp-search');renderCompList(q?q.value.trim().toUpperCase():'');
}

function updateCompCount(){
  var cnt=$('comp-count'),btn=$('comp-go');
  if(cnt)cnt.innerText=compSelected.size+'개 선택';
  if(btn){if(compSelected.size>=2){btn.classList.remove('opacity-50','pointer-events-none')}else{btn.classList.add('opacity-50','pointer-events-none')}}
}

function startCompare(){
  if(compSelected.size<2)return toast('2개 이상 선택하세요');
  $('compM').remove();
  showCompareResult();
}

function showCompareResult(){
  var e=$('compM');if(e)e.remove();
  var items=PL.filter(function(p){return compSelected.has(p.id)});
  if(items.length<2)return;

  var w=Math.min(1200,innerWidth*.96),h=innerHeight*.92;
  $('modals').insertAdjacentHTML('beforeend',
    '<div id="compM" class="fixed inset-0 z-[180] overlay">'+
    '<div class="absolute bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-slate-100" style="width:'+w+'px;height:'+h+'px;left:'+Math.max(0,(innerWidth-w)/2)+'px;top:'+Math.max(0,(innerHeight-h)/2)+'px">'+
    '<div class="bg-slate-900 px-5 py-3 flex justify-between items-center text-white shrink-0"><h3 class="font-extrabold text-lg">⚖️ 종목 비교 ('+items.length+'개)</h3><div class="flex gap-2"><button onclick="openCompareModal()" class="px-3 py-1.5 bg-slate-700 text-white rounded-lg text-sm font-bold border border-slate-600">다시 선택</button><button onclick="$(\'compM\').remove();SP.clear();compSelected.clear();render()" class="text-slate-400 hover:text-white text-2xl ml-3">✕</button></div></div>'+
    '<div id="comp-body" class="flex-1 overflow-auto sb p-5"></div>'+
    '</div></div>');

  var body=$('comp-body');
  // 비교 테이블
  var fields=[
    {key:'name',label:'종목명',fmt:function(p){return'<span class="font-extrabold text-slate-800">'+(p.name||p.ticker||'?')+'</span>'}},
    {key:'ticker',label:'티커',fmt:function(p){return'<span class="font-bold text-indigo-600">'+(p.ticker||'')+'</span>'}},
    {key:'cat',label:'카테고리',fmt:function(p){var c=cats.find(function(x){return x.id===p.cat});return c?c.icon+' '+c.label:p.cat}},
    {key:'currentPrice',label:'현재가',fmt:function(p){return p.currentPrice?'<span class="font-extrabold">'+fC(p.currentPrice,isKR(p))+'</span>':'—'}},
    {key:'buyPrice',label:'기간최저가',fmt:function(p){return p.buyPrice?fC(p.buyPrice,isKR(p)):'—'}},
    {key:'divYield',label:'배당률',fmt:function(p){return p.divYield?'<span class="text-emerald-600 font-bold">'+p.divYield+'</span>':'—'}},
    {key:'divFreq',label:'배당주기',fmt:function(p){return p.divFreq||'—'}},
    {key:'marketCap',label:'시가총액',fmt:function(p){return p.marketCap?fMC(p.marketCap,isKR(p),ER):'—'}},
    {key:'returnRate',label:'수익률',fmt:function(p){if(!p.avgBuyPrice||!p.currentPrice||p.avgBuyPrice<=0)return'—';var r=((p.currentPrice-p.avgBuyPrice)/p.avgBuyPrice)*100;return r>0?'<span class="text-rose-500 font-extrabold">+'+r.toFixed(2)+'%</span>':r<0?'<span class="text-blue-500 font-extrabold">'+r.toFixed(2)+'%</span>':'<span class="text-slate-500">0.00%</span>'}},
    {key:'ownedQty',label:'보유수량',fmt:function(p){return p.ownedQty?Number(p.ownedQty).toLocaleString():'—'}},
    {key:'ownedAmt',label:'평가금액',fmt:function(p){if(!p.ownedQty||!p.currentPrice)return'—';return'<span class="font-extrabold">'+fC(p.ownedQty*p.currentPrice,isKR(p))+'</span>'}},
    {key:'reviewOverall',label:'종합의견',fmt:function(p){return p.reviewOverall||'—'}},
    {key:'reviewRank',label:'투자순위',fmt:function(p){return p.reviewRank||'—'}}
  ];

  var t='<div class="overflow-x-auto sb rounded-xl border border-slate-200 mb-6"><table class="w-full text-sm"><thead><tr class="bg-slate-800 text-white"><th class="px-4 py-3 text-left font-extrabold whitespace-nowrap sticky left-0 bg-slate-800 z-10">항목</th>';
  items.forEach(function(p,i){t+='<th class="px-4 py-3 text-center font-extrabold whitespace-nowrap min-w-[160px]"><div class="flex flex-col items-center gap-1"><span class="text-base">'+(p.name||p.ticker||'?')+'</span>'+(p.ticker?'<span class="text-xs text-indigo-300">'+p.ticker+'</span>':'')+'</div></th>'});
  t+='</tr></thead><tbody>';
  fields.forEach(function(f,fi){
    t+='<tr class="'+(fi%2?'bg-slate-50':'bg-white')+' hover:bg-indigo-50/30"><td class="px-4 py-2.5 font-extrabold text-slate-600 whitespace-nowrap sticky left-0 z-10 '+(fi%2?'bg-slate-50':'bg-white')+'">'+f.label+'</td>';
    items.forEach(function(p){t+='<td class="px-4 py-2.5 text-center">'+f.fmt(p)+'</td>'});
    t+='</tr>';
  });
  t+='</tbody></table></div>';

  // 비교 차트: 배당률 + 수익률 레이더
  t+='<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">';
  t+='<div class="bg-white border border-slate-200 rounded-xl p-4"><h4 class="font-extrabold text-slate-700 mb-3">📊 배당률 비교</h4><div style="height:280px"><canvas id="cv-comp-div"></canvas></div></div>';
  t+='<div class="bg-white border border-slate-200 rounded-xl p-4"><h4 class="font-extrabold text-slate-700 mb-3">📈 수익률 비교</h4><div style="height:280px"><canvas id="cv-comp-ret"></canvas></div></div>';
  t+='</div>';

  body.innerHTML=t;

  // 배당률 차트
  var divLabels=[],divVals=[];
  items.forEach(function(p){
    divLabels.push(p.name||p.ticker||'?');
    var y=p.divYield?parseFloat(String(p.divYield).replace(/[^0-9.\-]+/g,'')):0;
    divVals.push(isNaN(y)?0:+y.toFixed(2));
  });
  destroyChart('comp1');
  chartInstances.comp1=new Chart($('cv-comp-div'),{type:'bar',data:{labels:divLabels,datasets:[{label:'배당률(%)',data:divVals,backgroundColor:CHART_COLORS.slice(0,divLabels.length).map(function(c){return c+'aa'}),borderColor:CHART_COLORS.slice(0,divLabels.length),borderWidth:1.5,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.raw+'%'}}}},scales:{y:{ticks:{callback:function(v){return v+'%'}},grid:{color:'#f1f5f9'}},x:{ticks:{font:{weight:'bold',size:12}},grid:{display:false}}}}});

  // 수익률 차트
  var retLabels=[],retVals=[],retColors=[],retBorders=[];
  items.forEach(function(p){
    retLabels.push(p.name||p.ticker||'?');
    if(p.avgBuyPrice&&p.currentPrice&&p.avgBuyPrice>0){
      var r=((p.currentPrice-p.avgBuyPrice)/p.avgBuyPrice)*100;
      retVals.push(+r.toFixed(2));
      retColors.push(r>=0?'rgba(244,63,94,0.6)':'rgba(59,130,246,0.6)');
      retBorders.push(r>=0?'#f43f5e':'#3b82f6');
    }else{retVals.push(0);retColors.push('#e2e8f0');retBorders.push('#cbd5e1')}
  });
  destroyChart('comp2');
  chartInstances.comp2=new Chart($('cv-comp-ret'),{type:'bar',data:{labels:retLabels,datasets:[{label:'수익률(%)',data:retVals,backgroundColor:retColors,borderColor:retBorders,borderWidth:1.5,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return(ctx.raw>0?'+':'')+ctx.raw+'%'}}}},scales:{y:{ticks:{callback:function(v){return v+'%'}},grid:{color:'#f1f5f9'}},x:{ticks:{font:{weight:'bold',size:12}},grid:{display:false}}}}});
}

/* =================================================================
   SECTION 25 — Firebase
   ================================================================= */
function initFB(){try{if(typeof __firebase_config==='undefined')throw'no';var c=JSON.parse(__firebase_config);firebase.initializeApp(c);auth=firebase.auth();db=firebase.firestore();appId=typeof __app_id!=='undefined'?__app_id:'us-stock-portfolio-v11';if(typeof __initial_auth_token!=='undefined'&&__initial_auth_token)auth.signInWithCustomToken(__initial_auth_token);else auth.signInAnonymously();auth.onAuthStateChanged(function(u){user=u;if(u)setupRT()})}catch(e){startOff()}}
function setupRT(){if(!user)return;var ref=db.collection('artifacts').doc(appId).collection('public').doc('data').collection('stockPortfolio').doc('sharedStateV11');ref.onSnapshot(function(snap){if(snap.exists){var d=snap.data();if(d.projects)PL=d.projects.map(migP);if(d.exchangeRate)ER=d.exchangeRate;if(d.sheetUrl)SU=d.sheetUrl;if(d.rowGroups)RG=migRG(d.rowGroups);cats=d.categories?migCat(d.categories):J(DC);LT=d.learningTabs||J(DL);ensureTK();save(true);render();if(firstLoad)doSync()}else if(firstLoad)startOff();firstLoad=false})}
function cloudSave(){if(!user)return toast("오프라인 모드");var ref=db.collection('artifacts').doc(appId).collection('public').doc('data').collection('stockPortfolio').doc('sharedStateV11');ref.set({projects:PL,exchangeRate:ER,rowGroups:RG,categories:cats,learningTabs:LT,sheetUrl:SU,updatedAt:new Date().toISOString()}).then(function(){save(true);toast("클라우드 저장 완료")}).catch(function(){toast("저장 실패")})}
function startOff(){if(!load()){PL=[];cats=J(DC);LT=J(DL)}ensureTK();save(true);render();doSync()}

/* =================================================================
   SECTION 26 — 앱 시작
   ================================================================= */
window.onload=function(){buildHdr();startTimer();initFB()};
</script>
